<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>英語讀默溫習系統</title>
  <!-- 引入外部獨立樣式檔 style.css -->
  <link rel="stylesheet" href="style.css">
  <!-- 引入外部獨立設定檔 config.js -->
  <script src="config.js"></script>
</head>
<body>

<div class="container">
  <header>
    <button class="key-btn" onclick="openKeyModal()">🔑</button>
    <h1 style="font-size:22px; margin-bottom:4px;">📖 英語讀默溫習系統</h1>
    <button class="settings-btn" onclick="document.getElementById('settingsModal').style.display='flex'">⚙️</button>
  </header>

  <div class="card" id="card1">
    <div class="card-header" onclick="toggleCard('card1')">
      <h2>📂 1. 課文庫與匯入</h2>
      <span class="card-toggle-icon">▼</span>
    </div>
    <div class="card-body">
      <div class="tab-header">
        <div id="tabLoad" class="tab-btn active" onclick="switchTab('load')">📂 讀取</div>
        <div id="tabSync" class="tab-btn" onclick="switchTab('sync')">
          <span id="tabSyncIcon" class="hourglass-spin">⏳</span> 同步<span id="tabSyncBadge" class="badge-alert">0</span>
        </div>
        <div id="tabNew" class="tab-btn" onclick="switchTab('new')">➕ 新增</div>
      </div>

      <!-- 1. 讀取分頁 -->
      <div id="panelLoad">
        <label style="margin-top:0;">已儲存課文：</label>
        <div class="row">
          <select id="cloudSaveSelect" class="col"><option value="">載入中...</option></select>
          <button class="btn-secondary" style="width:auto; margin:0;" onclick="loadSelectedSave()">讀取</button>
          <button class="btn-danger" style="width:auto; margin:0;" onclick="deleteSelectedSave()">刪除</button>
        </div>
      </div>

      <!-- 2. 同步分頁 -->
      <div id="panelSync" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <span id="syncRepoLabel" style="font-size:12px; color:#64748b; font-weight:600;">檢查中...</span>
          <button class="btn-secondary" style="width:auto; margin:0; padding:4px 10px; font-size:12px;" onclick="checkGitHubSyncStatus(true)">🔍 檢查</button>
        </div>

        <div class="row" style="margin-bottom:12px;">
          <div class="sync-stat-box" style="border-color:#fde68a; background:#fffbeb;">
            <div style="font-size:12px; color:#b45309; font-weight:bold;">📦 待同步至 GitHub</div>
            <div id="unsyncedCountNum" class="sync-stat-num" style="color:#d97706;">-</div>
            <div style="font-size:11px; color:#92400e;">未上載之音檔與課文變更</div>
          </div>
        </div>

        <button id="btnSyncGh" class="btn-action" style="margin-top:0;" onclick="runGitHubSync()" disabled>☁️ 同步</button>

        <div id="syncErrorBox" class="sync-error-box"></div>
      </div>

      <!-- 3. 新增分頁 -->
      <div id="panelNew" style="display:none;">
        <div style="background:#f1f5f9; padding:10px; border-radius:8px; margin-bottom:15px;">
          <label style="margin-top:0;">🔍 OCR 圖片提取：</label>
          <select id="modelSelect" style="margin-bottom:8px;"><option value="">載入中...</option></select>
          <div class="row">
            <input type="file" id="imageUpload" accept="image/*" class="col" style="padding:6px; font-size:13px;">
            <button id="ocrBtn" onclick="runOcr()" style="width:auto; margin:0; padding:6px 12px; font-size:14px;">提取</button>
          </div>
          <div id="ocrStatus" style="font-size: 12px; color: #2563eb; margin-top: 4px;"></div>
        </div>
        
        <label>課文標題：</label>
        <input type="text" id="saveTitle" placeholder="例如：Chapter 1">
        
        <label>課文內容 (空行分段)：</label>
        <textarea id="textContent" placeholder="請貼上或辨識課文..."></textarea>
        
        <div class="row" style="margin-top:8px;">
          <button class="btn-warning col" id="mainActionBtn" onclick="breakdownTextAndDownload()">📝 儲存並下載</button>
          <button class="btn-secondary" style="width:auto;" onclick="clearNewForm()">清空</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card" id="card2">
    <div class="card-header" onclick="toggleCard('card2')">
      <h2>📖 2. 溫習與讀默模式</h2>
      <span class="card-toggle-icon">▼</span>
    </div>
    <div class="card-body">
      
      <div class="row" style="margin-bottom: 12px; align-items:center;">
        <label style="margin:0; width:auto; flex:1;">連播停頓：</label>
        <button class="btn-secondary" style="margin:0; width:auto; padding:6px 12px;" onclick="document.getElementById('pauseContinuous').value=1">1 秒</button>
        <button class="btn-secondary" style="margin:0; width:auto; padding:6px 12px;" onclick="document.getElementById('pauseContinuous').value=5">5 秒</button>
        
        <button class="btn-secondary" style="margin:0; width:36px; padding:6px; font-weight:bold; font-size:16px;" onclick="changePauseContinuous(1)">+</button>
        <input type="number" id="pauseContinuous" value="5" min="0" max="60" step="1" style="margin:0; width:50px; padding:6px; text-align:center;">
        <button class="btn-secondary" style="margin:0; width:36px; padding:6px; font-weight:bold; font-size:16px;" onclick="changePauseContinuous(-1)">-</button>
      </div>
      
      <div class="row">
        <button onclick="startContinuousPlay(false)" class="col" style="background:#0284c7; margin-top:0;">▶️ 全段連播</button>
        <button onclick="stopAudio()" class="btn-secondary col" style="margin-top:0;">⏹️ 停止</button>
      </div>

      <div class="dictation-panel">
        <div id="paragraphSelectorContainer" style="display:none; margin-bottom: 15px; background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1;">
          <label style="margin-top:0;">📚 段落：</label>
          <select id="paragraphSelect" onchange="changeParagraph()" style="margin-top:4px;"></select>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
          <h3 style="font-size:15px; color:#b45309; margin:0;">✍️ 逐句讀默</h3>
          <label style="display:inline-flex; align-items:center; cursor:pointer; font-weight:normal; color:#475569; margin:0;">
            <input type="checkbox" id="hideTextToggle" onchange="toggleTextVisibility('dictationList', 'hideTextToggle')" style="width:auto; margin:0 6px 0 0;">盲聽
          </label>
        </div>

        <div id="dictationList" style="margin-top: 10px; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; min-height: 50px;">
          <div style="text-align:center; color:#94a3b8; padding: 10px;">請先讀取或新增課文</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card" id="card3">
    <div class="card-header" onclick="toggleCard('card3')">
      <h2>📝 3. 重默生字模式</h2>
      <span class="card-toggle-icon">▼</span>
    </div>
    <div class="card-body">
      <div class="row" style="margin-bottom: 12px;">
        <button onclick="startContinuousPlay(true)" class="col" style="background:#0284c7; margin-top:0;">▶️ 生字連播</button>
        <button onclick="stopAudio()" class="btn-secondary col" style="margin-top:0;">⏹️ 停止</button>
      </div>

      <div class="dictation-panel" style="background:#f0fdf4; border-color:#86efac;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <h3 style="font-size:15px; color:#166534; margin:0;">📝 生字清單</h3>
            <label style="display:inline-flex; align-items:center; cursor:pointer; font-weight:normal; font-size:13px; color:#166534; margin:0;">
              <input type="checkbox" id="viewAllMistakesToggle" onchange="renderMistakeList()" style="width:auto; margin:0 4px 0 0;">全部段落
            </label>
          </div>
          <label style="display:inline-flex; align-items:center; cursor:pointer; font-weight:normal; color:#475569; margin:0;">
            <input type="checkbox" id="hideMistakeToggle" onchange="toggleTextVisibility('mistakeList', 'hideMistakeToggle')" style="width:auto; margin:0 6px 0 0;">盲聽
          </label>
        </div>

        <div id="mistakeList" style="margin-top: 10px; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; min-height: 50px;">
          <div style="text-align:center; color:#94a3b8; padding: 10px;">請先在第2區點字標記</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card" style="text-align: center; border:none; box-shadow:none; background:transparent;">
    <h2 style="font-size:14px; color:#64748b;">📱 手機掃描</h2>
    <img id="qrImg" width="150" height="150" src="" style="margin-top:5px; border-radius:8px; display:none;">
    <div id="urlText" style="font-size:12px; color:#64748b; margin-top:8px; word-break:break-all; display:none;"></div>
  </div>
</div>

<!-- API Key 設定與容量明細視窗 -->
<div id="keyModal" class="modal-overlay" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal-content">
    <h3 style="margin-top:0; margin-bottom:12px; color:#334155;">🔑 API Key 設定</h3>

    <label>Gemini API Key：</label>
    <div id="geminiKeyStatus" style="font-size:13px; color:#10b981; font-weight:bold; margin-bottom:5px; display:none; cursor:pointer;">✅ 已設定 (點擊修改)</div>
    <input type="text" id="geminiKeyInput" placeholder="AIzaSy... 或 AQ..." style="margin-bottom:10px; display:none;">
    
    <label>Google Cloud TTS Key：</label>
    <div id="gcpTtsKeyStatus" style="font-size:13px; color:#10b981; font-weight:bold; margin-bottom:5px; display:none; cursor:pointer;">✅ 已設定 (點擊修改)</div>
    <input type="text" id="gcpTtsKeyInput" placeholder="AIzaSy..." style="margin-bottom:10px; display:none;">
    
    <label>Microsoft Azure TTS Key：</label>
    <div id="azureTtsKeyStatus" style="font-size:13px; color:#10b981; font-weight:bold; margin-bottom:5px; display:none; cursor:pointer;">✅ 已設定 (點擊修改)</div>
    <input type="text" id="azureTtsKeyInput" placeholder="輸入 Azure Key" style="margin-bottom:10px; display:none;">

    <label>GitHub Token (需 repo 權限)：</label>
    <div id="ghTokenStatus" style="font-size:13px; color:#10b981; font-weight:bold; margin-bottom:5px; display:none; cursor:pointer;">✅ 已設定 (點擊修改)</div>
    <input type="text" id="ghTokenInput" placeholder="ghp_... 或 github_pat_..." style="margin-bottom:10px; display:none;">

    <!-- PropertiesService 容量明細 (點擊展開) -->
    <div class="storage-trigger-bar" onclick="toggleKeyStorageDetail()">
      <span id="keyModalUsageText">📊 容量明細: 載入中...</span>
      <span id="keyModalUsageArrow">▼</span>
    </div>
    <div id="storageDetailBody" style="display:none; margin-top:8px; font-size:12px; color:#334155;"></div>
    
    <div class="row" style="margin-top:16px;">
      <button class="btn-action col" onclick="saveKeys()">💾 儲存</button>
      <button class="btn-secondary col" onclick="document.getElementById('keyModal').style.display='none'">關閉</button>
    </div>
  </div>
</div>

<div id="toast" class="toast-message">
  <span id="toastText">通知訊息</span>
  <span class="toast-close" onclick="hideToast()">關閉</span>
</div>

<div id="settingsModal" class="modal-overlay" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal-content">
    <h3 style="margin-top:0; margin-bottom:10px; color:#334155;">⚙️ 發音設定</h3>
    <select id="googleVoiceSelect" onchange="handleVoiceChange()">
      <optgroup label="🇭🇰 港澳口音 (Azure Neural)">
        <option value="en-HK-YanNeural,en-HK">港式女聲 (YanNeural)</option>
        <option value="en-HK-SamNeural,en-HK">港式男聲 (SamNeural)</option>
      </optgroup>
      <optgroup label="🇺🇸 美式發音 (Chirp 3 HD)">
        <option value="en-US-Chirp3-HD-Aoede,en-US">美式女聲 (Aoede)</option>
        <option value="en-US-Chirp3-HD-Charon,en-US">美式男聲 (Charon)</option>
        <option value="en-US-Chirp3-HD-Fenrir,en-US">美式男聲 (Fenrir)</option>
        <option value="en-US-Chirp3-HD-Kore,en-US">美式女聲 (Kore)</option>
        <option value="en-US-Chirp3-HD-Puck,en-US">美式男聲 (Puck)</option>
        <option value="en-US-Chirp3-HD-Zeus,en-US">美式男聲 (Zeus)</option>
      </optgroup>
    </select>
    <button class="btn-secondary" onclick="document.getElementById('settingsModal').style.display='none'" style="margin-top:16px;">關閉</button>
  </div>
</div>

<div id="pauseController" class="floating-wrapper pause-wrapper collapsed" style="display:none;">
  <div id="pauseToggleBtn" class="floating-toggle-btn pause-toggle-btn" onclick="stopGlobalPlayback(event)">⏸️</div>
</div>

<div id="downloadController" class="floating-wrapper download-wrapper collapsed" style="display:none;">
  <div class="floating-toggle-btn download-toggle-btn" onclick="openDownloadBar(event)">
    <span id="dlIcon" style="display:inline-block;">⏳</span>
  </div>
  <div class="floating-bar-content download-bar-content" onclick="closeDownloadBar(event)">
    <span id="dlDetailText" class="download-val-display"></span>
    <button id="dlPauseBtn" onclick="toggleDownloadPause(event)" class="btn-secondary">⏸️</button>
  </div>
</div>

<div id="speedController" class="floating-wrapper speed-wrapper collapsed">
  <div class="floating-toggle-btn speed-toggle-btn" onclick="openSpeedBar(event)">🐰</div>
  <div class="floating-bar-content speed-bar-content" onclick="closeSpeedBar(event)">
    <span class="speed-label-text">語速</span>
    <span id="floatingSpeedVal" class="speed-val-display">0.80x</span>
    <button onclick="changeGlobalSpeed(0.05, event)" class="btn-secondary">+</button>
    <button onclick="changeGlobalSpeed(-0.05, event)" class="btn-secondary">-</button>
  </div>
</div>

<script>
  var APP_CFG = window.APP_CONFIG || {};
  function getCfgGasUrl() { return (APP_CFG.GAS_URL || "").trim(); }
  function getCfgRepo() { return (APP_CFG.GITHUB_REPO || "").trim(); }
  function getCfgBranch() { return (APP_CFG.GITHUB_BRANCH || "main").trim(); }
  function getCurrentVoiceName() { return document.getElementById('googleVoiceSelect').value.split(',')[0]; }

  (function setupGasBridge() {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      function createRunner(successCb, failureCb) {
        return new Proxy({}, {
          get: function(target, prop) {
            if (prop === 'withSuccessHandler') return function(cb) { return createRunner(cb, failureCb); };
            if (prop === 'withFailureHandler') return function(cb) { return createRunner(successCb, cb); };
            return function() {
              var args = Array.prototype.slice.call(arguments);
              var gasUrl = getCfgGasUrl();
              if (!gasUrl || gasUrl.indexOf("請替換") !== -1) {
                var err = "請先檢查 config.js 設定";
                if (failureCb) failureCb(err); else showToast(err, true);
                return;
              }
              fetch(gasUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: prop, args: args })
              })
              .then(function(r) { return r.json(); })
              .then(function(res) {
                if (res.status === 'success') { if (successCb) successCb(res.data); }
                else { if (failureCb) failureCb(res.message); else showToast(res.message, true); }
              })
              .catch(function(err) {
                if (failureCb) failureCb(err);
              });
            };
          }
        });
      }
      window.google = { script: { run: createRunner(null, null) } };
    }
  })();

  var sharedAudio = new Audio();
  sharedAudio.playsInline = true;
  var currentAudio = null;

  var nativeVoices = [];
  var clientLessonsMap = {};
  var dirtyLessonIds = {};

  var currentSaveId = "";
  var currentLessonTitle = "";
  var currentLessonText = "";
  var currentLessonVoices = [];
  var currentLessonDate = 0;

  var paragraphs = []; 
  var paragraphMistakes = []; 
  var currentParaIndex = 0;
  var latestStorageDetails = null;
  var currentUnsyncedCount = 0;

  var modelsLoaded = false;
  var modelsLoading = false;

  // 音檔播放狀態表：audioStateMap[voiceKey][text] = { source: 'github' | 'drive' | 'api', url: '...', fileId: '...', base64: '...' }
  var audioStateMap = {};
  
  var sentenceFetchQueue = []; 
  var wordFetchQueue = []; 
  var totalFetchSents = 0;
  var totalFetchWords = 0;
  var isDownloading = false; 
  var isDownloadPaused = false;

  var isContinuousPlaying = false;
  var continuousIndex = 0;
  var continuousTimer = null;
  var continuousPlayList = []; 
  var isMistakeContinuous = false;
  var currentRenderedMistakes = []; 
  var lastMistakeViewMode = false;

  var lastPlayedDictRowId = null;   
  var lastPlayedMistakeRowId = null; 
  var absoluteLastPlayedRowId = null; 
  var currentlyPlayingRowId = null;  

  var globalSpeedValue = 0.80; 
  var speedCollapseTimer = null;
  var dlCollapseTimer = null;
  var toastTimer = null;

  document.addEventListener('click', function(e) {
    var sBar = document.getElementById('speedController');
    if (sBar && !sBar.classList.contains('collapsed')) {
      if (!sBar.contains(e.target) || e.target.classList.contains('speed-bar-content')) {
        sBar.classList.add('collapsed');
        if (speedCollapseTimer) clearTimeout(speedCollapseTimer);
      }
    }
    var dBar = document.getElementById('downloadController');
    if (dBar && !dBar.classList.contains('collapsed')) {
      if (!dBar.contains(e.target) || e.target.classList.contains('download-bar-content')) {
        dBar.classList.add('collapsed');
        if (dlCollapseTimer) clearTimeout(dlCollapseTimer);
      }
    }
  });

  window.addEventListener('DOMContentLoaded', function() {
    try { localStorage.removeItem('dictation_audio_cache'); } catch(e) {}
    initNativeVoices(); 
    updateGlobalSpeedDisplay();
    loadAppUrlAndQr();

    // 步驟 1：0.1 秒極速直接從 GitHub 讀取 lessons.json
    loadLessonsFromGitHubFast();

    // 步驟 2：向 GAS 發送單一整合請求 (合併未同步暫存課文 + 檢查同步狀態)，完成後才載入 Gemini 模型
    initFromGasBackend();
  });

  // 0.1 秒極速直讀 GitHub lessons.json (若有最新 Commit SHA 則優先用 SHA 網址破除 CDN 快取)
  function loadLessonsFromGitHubFast() {
    var repo = getCfgRepo();
    var branch = getCfgBranch();
    if (!repo || repo.indexOf("請替換") !== -1) return;

    var savedSha = "";
    try { savedSha = localStorage.getItem('dictation_gh_sha_' + repo) || ""; } catch (e) {}
    var refPart = savedSha ? savedSha : encodeURIComponent(branch);
    var rawUrl = "https://raw.githubusercontent.com/" + repo + "/" + refPart + "/lessons.json?t=" + new Date().getTime();

    fetch(rawUrl)
      .then(function(r) {
        if (!r.ok) throw new Error("Not found");
        return r.json();
      })
      .then(function(data) {
        if (data && data.lessons) {
          for (var k in data.lessons) {
            if (!clientLessonsMap[k]) clientLessonsMap[k] = data.lessons[k];
          }
          renderLessonSelectDropdown();
        }
      })
      .catch(function() {});
  }

  // 單一開機 GAS 請求：完成後才在背景啟動 loadModels()
  function initFromGasBackend() {
    setSyncTabIcon('loading');
    google.script.run
      .withSuccessHandler(function(res) {
        if (res) {
          if (res.latestCommitSha) {
            try { localStorage.setItem('dictation_gh_sha_' + getCfgRepo(), res.latestCommitSha); } catch (e) {}
          }
          if (res.lessonsMap) {
            clientLessonsMap = res.lessonsMap;
            renderLessonSelectDropdown();
          }
          if (res.storageDetails) {
            updateStorageDetailsUI(res.storageDetails);
          }
          if (res.syncStatus) {
            updateSyncStatusUI(res.syncStatus);
          }
        }
        // 完成所有開機 GAS 請求後，才在背景載入 Gemini 模型
        loadModels();
      })
      .withFailureHandler(function() {
        setSyncTabIcon('error');
        loadModels();
      })
      .getInitData(getCfgRepo(), getCfgBranch(), getCurrentVoiceName());
  }

  function renderLessonSelectDropdown() {
    var sel = document.getElementById('cloudSaveSelect');
    var list = [];
    for (var id in clientLessonsMap) {
      list.push(clientLessonsMap[id]);
    }
    list.sort(function(a, b) { return (b.date || 0) - (a.date || 0); });

    sel.innerHTML = '';
    if (list.length === 0) {
      sel.innerHTML = '<option value="">(無紀錄)</option>';
    } else {
      list.forEach(function(s) {
        var dateStr = s.date ? new Date(s.date).toLocaleDateString('zh-HK') : '';
        var opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.title + (dateStr ? ' (' + dateStr + ')' : '');
        if (s.id === currentSaveId) opt.selected = true;
        sel.appendChild(opt);
      });
    }
  }

  // ==========================================
  // API Key 視窗內的「📊 容量明細」
  // ==========================================
  function updateStorageDetailsUI(details) {
    if (!details) return;
    latestStorageDetails = details;
    var txtEl = document.getElementById('keyModalUsageText');
    if (txtEl) {
      txtEl.textContent = '📊 容量明細: ' + details.totalKB + ' / 500 KB (' + details.totalPercent + '%)';
    }
    var bodyEl = document.getElementById('storageDetailBody');
    if (bodyEl && bodyEl.style.display !== 'none') {
      renderStorageModalContent();
    }
  }

  function toggleKeyStorageDetail() {
    var body = document.getElementById('storageDetailBody');
    var arrow = document.getElementById('keyModalUsageArrow');
    if (body.style.display === 'none') {
      renderStorageModalContent();
      body.style.display = 'block';
      arrow.textContent = '▲';
    } else {
      body.style.display = 'none';
      arrow.textContent = '▼';
    }
  }

  function renderStorageModalContent() {
    var body = document.getElementById('storageDetailBody');
    if (!latestStorageDetails) {
      body.innerHTML = '載入中...';
      return;
    }
    var d = latestStorageDetails;
    var html = [];

    // 1. 4 條 API Key
    html.push('<div class="storage-section-title">🔑 金鑰設定 (' + d.keysTotalKB + ' KB / ' + d.keysTotalPercent + '%)</div>');
    html.push('<div class="storage-list">');
    if (d.keyItems.length === 0) {
      html.push('<div class="storage-row"><span>(尚未設定任何金鑰)</span><span>0 KB</span></div>');
    } else {
      d.keyItems.forEach(function(k) {
        html.push('<div class="storage-row"><span>' + k.label + '</span><span>' + k.kb + ' KB (' + k.bytes + ' B)</span></div>');
      });
    }
    html.push('</div>');

    // 2. 待同步課文暫存 (同步上 GitHub 後會自動歸零)
    if (d.lessonItems && d.lessonItems.length > 0) {
      html.push('<div class="storage-section-title">📖 待同步課文暫存 (' + d.lessonsTotalKB + ' KB / ' + d.lessonsTotalPercent + '%)</div>');
      html.push('<div class="storage-list">');
      d.lessonItems.forEach(function(l) {
        html.push('<div class="storage-row"><span>' + l.title + '</span><span>' + l.kb + ' KB</span></div>');
      });
      html.push('</div>');
    }

    // 3. 其他未知/殘留項目 (如舊 GITHUB_REPO / GITHUB_BRANCH)
    if (d.otherItems && d.otherItems.length > 0) {
      html.push('<div class="storage-section-title" style="color:#dc2626;">⚠️ 其他殘留項目 (' + d.othersTotalKB + ' KB / ' + d.othersTotalPercent + '%)</div>');
      html.push('<div class="storage-list">');
      d.otherItems.forEach(function(o) {
        html.push('<div class="storage-row"><span style="word-break:break-all;">' + o.key + '</span><span>' + o.kb + ' KB</span></div>');
      });
      html.push('</div>');
      html.push('<button class="btn-danger" style="margin-top:8px; padding:6px 10px; font-size:12px;" onclick="cleanOrphanProperties()">🗑️ 清除殘留項目</button>');
    }

    body.innerHTML = html.join('');
  }

  function setSyncTabIcon(state) {
    var iconEl = document.getElementById('tabSyncIcon');
    if (!iconEl) return;
    iconEl.className = '';
    if (state === 'loading') {
      iconEl.textContent = '⏳';
      iconEl.className = 'hourglass-spin';
    } else if (state === 'unsynced') {
      iconEl.textContent = '☁️';
    } else if (state === 'ok') {
      iconEl.textContent = '✅';
    } else {
      iconEl.textContent = '⚠️';
    }

  function showSyncError(errMsg) {
    var errBox = document.getElementById('syncErrorBox');
    if (!errMsg) {
      errBox.style.display = 'none';
      errBox.textContent = '';
    } else {
      errBox.style.display = 'block';
      errBox.innerHTML = '<b>❌ 錯誤：</b>' + errMsg;
    }
  }

  function checkGitHubSyncStatus(forceRescan) {
    setSyncTabIcon('loading');
    document.getElementById('syncRepoLabel').textContent = '檢查中...';
    if (forceRescan) {
      showSyncError(null);
      showToast('🔍 檢查中...');
    }
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.latestCommitSha) {
          try { localStorage.setItem('dictation_gh_sha_' + getCfgRepo(), res.latestCommitSha); } catch (e) {}
        }
        updateSyncStatusUI(res);
        if (forceRescan && res && !res.error) showToast('✅ 檢查完成');
      })
      .withFailureHandler(function(err) {
        setSyncTabIcon('error');
        if (forceRescan) showSyncError(err);
      })
      .checkSyncStatus(getCfgRepo(), getCfgBranch(), getCurrentVoiceName(), !!forceRescan);

  function setUnsyncedCounterUI(count) {
    currentUnsyncedCount = count || 0;
    var tabBadge = document.getElementById('tabSyncBadge');
    var btnSync = document.getElementById('btnSyncGh');

    document.getElementById('unsyncedCountNum').textContent = currentUnsyncedCount;
    btnSync.disabled = (currentUnsyncedCount === 0);

    if (currentUnsyncedCount > 0) {
      tabBadge.textContent = currentUnsyncedCount;
      tabBadge.style.display = 'inline-block';
      setSyncTabIcon('unsynced');
    } else {
      tabBadge.style.display = 'none';
      setSyncTabIcon('ok');
    }
  }

  function incrementUnsyncedCounter() {
    setUnsyncedCounterUI(currentUnsyncedCount + 1);
  }

  function updateSyncStatusUI(res) {
    var tabBadge = document.getElementById('tabSyncBadge');
    var repoLabel = document.getElementById('syncRepoLabel');
    var btnSync = document.getElementById('btnSyncGh');

    if (!res || !res.configured) {
      setSyncTabIcon('error');
      repoLabel.textContent = "未設定 GitHub";
      document.getElementById('unsyncedCountNum').textContent = "-";
      tabBadge.style.display = 'none';
      btnSync.disabled = true;
      return;
    }

    if (res.error) {
      setSyncTabIcon('error');
      repoLabel.textContent = "⚠️ 檢查錯誤";
      showSyncError(res.error);
      btnSync.disabled = true;
      return;
    }

    repoLabel.textContent = "🐙 " + res.repo;
    setUnsyncedCounterUI(res.unsyncedCount || 0);
  }

  function runGitHubSync() {
    var btn = document.getElementById('btnSyncGh');
    btn.disabled = true;
    btn.textContent = "同步中";
    setSyncTabIcon('loading');
    showSyncError(null);
    showToast("☁️ 同步中...");

    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.success) {
          btn.disabled = false;
          btn.textContent = "☁️ 同步";
          setSyncTabIcon('error');
          var errMsg = res ? res.error : "未知錯誤";
          showSyncError(errMsg);
          return showToast("同步失敗：" + errMsg, true);
        }
        if (res.latestCommitSha) {
          try { localStorage.setItem('dictation_gh_sha_' + getCfgRepo(), res.latestCommitSha); } catch (e) {}
        }
        if (res.storageDetails) {
          updateStorageDetailsUI(res.storageDetails);
        }
        if (res.status) updateSyncStatusUI(res.status);
        
        if (res.remainingCount > 0) {
          btn.disabled = true;
          btn.textContent = "同步中";
          setSyncTabIcon('loading');
          showToast("已同步 " + res.syncedCount + " 項，剩餘 " + res.remainingCount + " 項...");
          setTimeout(function() {
            runGitHubSync();
          }, 2000);
        } else {
          dirtyLessonIds = {};
          btn.textContent = "☁️ 同步";
          showToast("🎉 同步完成！");
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = "☁️ 同步";
        setSyncTabIcon('error');
        showSyncError(err);
        showToast("連線錯誤：" + err, true);
      })
      .syncDriveToGitHub(getCfgRepo(), getCfgBranch(), getCurrentVoiceName());
  }

  function saveKeys() {
    var gKey = document.getElementById('geminiKeyInput').value.replace(/[\s"']/g, '');
    var gcpKey = document.getElementById('gcpTtsKeyInput').value.replace(/[\s"']/g, '');
    var azKey = document.getElementById('azureTtsKeyInput').value.replace(/[\s"']/g, '');
    var ghToken = document.getElementById('ghTokenInput').value.replace(/[\s"']/g, '');
    
    if (gKey && ((!gKey.startsWith('AIzaSy') && !gKey.startsWith('AQ.')) || gKey.length < 35)) return showToast('Gemini Key 格式錯誤', true);
    if (gcpKey && (!gcpKey.startsWith('AIzaSy') || gcpKey.length < 35)) return showToast('Google TTS Key 格式錯誤', true);
    if (azKey && azKey.length < 20) return showToast('Azure TTS Key 格式錯誤', true);
    
    document.getElementById('keyModal').style.display = 'none';
    showToast('儲存中...');
    google.script.run.withSuccessHandler(function(status) {
      if (status && status.storageDetails) updateStorageDetailsUI(status.storageDetails);
      showToast('🔑 已儲存');
      if (gKey) { modelsLoaded = false; loadModels(); }
      checkGitHubSyncStatus(false);
    }).saveApiKeys(gKey, gcpKey, azKey, ghToken);
  }

  function switchTab(tabId) {
    var tabs = ['load', 'sync', 'new'];
    var panels = { load: 'panelLoad', sync: 'panelSync', new: 'panelNew' };
    var btns = { load: 'tabLoad', sync: 'tabSync', new: 'tabNew' };

    tabs.forEach(function(t) {
      if (t === tabId) {
        document.getElementById(btns[t]).classList.add('active');
        document.getElementById(panels[t]).style.display = 'block';
      } else {
        document.getElementById(btns[t]).classList.remove('active');
        document.getElementById(panels[t]).style.display = 'none';
      }
    });

    // 點擊「➕ 新增」時若尚未載入 Gemini 模型則觸發載入 (已載入過則不會重複載入)
    if (tabId === 'new') {
      loadModels();
    }
  }

    else toast.classList.remove('alert');
    toast.classList.add('show');
    
    if (toastTimer) clearTimeout(toastTimer);
    if (!isAlert) {
      toastTimer = setTimeout(function() {
        toast.classList.remove('show');

    }

  // ==========================================
  // 課文讀取、新增、標記生字與刪除 (無需塞入新增 inputbox)
  // ==========================================
  function loadSelectedSave() {
    var id = document.getElementById('cloudSaveSelect').value;
    if (!id) return showToast('請先選擇課文', true);
    var data = clientLessonsMap[id];
    if (!data) return showToast('讀取失敗', true);

    stopAudio();
    currentSaveId = data.id;
    currentLessonTitle = data.title || '未命名課文';
    currentLessonText = data.text || '';
    currentLessonVoices = data.voices ? data.voices.slice() : [];
    currentLessonDate = data.date || new Date().getTime();

    // 深拷貝段落與生字陣列
    paragraphs = JSON.parse(JSON.stringify(data.paragraphs || []));
    paragraphMistakes = JSON.parse(JSON.stringify(data.mistakes || []));
    currentParaIndex = 0;
    lastPlayedDictRowId = null;
    lastPlayedMistakeRowId = null;
    absoluteLastPlayedRowId = null;

    updateParagraphSelector();
    renderDictationList();
    renderMistakeList();
    checkAndDownloadAudio(); 
    closeTopCards(); 
    showToast('📂 已載入：' + currentLessonTitle);
  }

  function deleteSelectedSave() {
    var id = document.getElementById('cloudSaveSelect').value;
    if (!id) return;
    showToast('刪除中...');
    delete clientLessonsMap[id];
    renderLessonSelectDropdown();

    if (currentSaveId === id) {
      currentSaveId = '';
      currentLessonTitle = '';
      currentLessonText = '';
      paragraphs = [];
      paragraphMistakes = [];
      document.getElementById('paragraphSelectorContainer').style.display = 'none';
      document.getElementById('dictationList').innerHTML = '<div style="text-align:center; color:#94a3b8; padding: 10px;">請先讀取或新增課文</div>';
      document.getElementById('mistakeList').innerHTML = '<div style="text-align:center; color:#94a3b8; padding: 10px;">請先點字標記</div>';
      stopAudio();
    }

    if (!dirtyLessonIds[id]) {
      dirtyLessonIds[id] = true;
      incrementUnsyncedCounter();
    }

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.storageDetails) updateStorageDetailsUI(res.storageDetails);
        showToast('🗑️ 已刪除 (請按同步更新至 GitHub)');
      })
      .deleteCloudSave(id);
  }

  function autoSaveToCloud() {
    if (!currentSaveId || !currentLessonText) return;

    var vName = getCurrentVoiceName();
    if (vName && currentLessonVoices.indexOf(vName) === -1) {
      currentLessonVoices.push(vName);
    }

    clientLessonsMap[currentSaveId] = {
      id: currentSaveId,
      title: currentLessonTitle,
      text: currentLessonText,
      paragraphs: paragraphs,
      mistakes: paragraphMistakes,
      voices: currentLessonVoices,
      date: currentLessonDate
    };
    renderLessonSelectDropdown();

    // 若該課文在本次修改前尚未標記為待同步，立即將待同步紅字 +1
    if (!dirtyLessonIds[currentSaveId]) {
      dirtyLessonIds[currentSaveId] = true;
      incrementUnsyncedCounter();
    }

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.storageDetails) updateStorageDetailsUI(res.storageDetails);
      })
      .saveToCloud(currentSaveId, currentLessonTitle, currentLessonText, paragraphs, paragraphMistakes, vName, currentLessonVoices, currentLessonDate);
  }

  function clearNewForm() {
    document.getElementById('saveTitle').value = '';
    document.getElementById('textContent').value = '';
    document.getElementById('ocrStatus').textContent = '';
  }

  // 載入 Gemini 模型 (已載入或載入中則不重複請求)
  function loadModels() {
    if (modelsLoaded || modelsLoading) return;
    modelsLoading = true;
    var sel = document.getElementById('modelSelect');
    google.script.run
      .withSuccessHandler(function(res) {
        modelsLoading = false;
        sel.innerHTML = '';
        if(res && res.success && res.models && res.models.length > 0) {
          modelsLoaded = true;
          res.models.forEach(function(m, i) {
            var opt = document.createElement('option');
            opt.value = m.id; opt.textContent = m.displayName;
            if(i===0) opt.selected = true;
            sel.appendChild(opt);
          });
        } else {
          var errorMsg = (res && res.error) ? res.error : "請檢查 Key";
          sel.innerHTML = '<option value="">⚠️ 載入失敗 (' + errorMsg + ')</option>';
        }
      })
      .withFailureHandler(function() {
        modelsLoading = false;
        sel.innerHTML = '<option value="">⚠️ 載入失敗</option>';
      })
      .getAvailableGeminiModels();
  }

  function runOcr() {
    var fileInput = document.getElementById('imageUpload');
    if(!fileInput.files[0]) return showToast('請先選擇圖片', true);
    document.getElementById('ocrBtn').disabled = true;
    document.getElementById('ocrStatus').textContent = '辨識中...';
    var reader = new FileReader();
    reader.onload = function(e) {
      google.script.run
        .withSuccessHandler(function(res) {
          document.getElementById('ocrBtn').disabled = false;
          if(res.success) { 
            var resultText = res.text;
            var titleMatch = resultText.match(/^TITLE:\s*(.*)/i);
            if (titleMatch) {
              document.getElementById('saveTitle').value = titleMatch[1].trim();
              resultText = resultText.replace(/^TITLE:\s*(.*)\n*/i, '').trim();
            }
            document.getElementById('textContent').value = resultText; 
            document.getElementById('ocrStatus').textContent = '成功！'; 
          } else { 
            document.getElementById('ocrStatus').textContent = '錯誤：' + res.error; 
          }
        })
        .withFailureHandler(function() {
          document.getElementById('ocrBtn').disabled = false;
          document.getElementById('ocrStatus').textContent = '連線錯誤';
        })
        .processImageWithGemini(e.target.result, document.getElementById('modelSelect').value, document.getElementById('saveTitle').value.trim());
    };
    reader.readAsDataURL(fileInput.files[0]);
  }

  function splitSentences(text) {
    return text.replace(/([.?!])\s*(?=[A-Za-z0-9])/g, "$1|").replace(/\n/g, "|").split("|").map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; });
  }

  function breakdownTextAndDownload() {
    stopAudio();
    var rawTitle = document.getElementById('saveTitle').value.trim() || '未命名課文';
    var rawText = document.getElementById('textContent').value.trim();
    if(!rawText) return showToast('請先輸入課文', true);

    var rawParagraphs = rawText.split(/\n\s*\n/); 
    paragraphs = [];
    paragraphMistakes = [];
    rawParagraphs.forEach(function(pText) {
      var sents = splitSentences(pText);
      if(sents.length > 0) {
        paragraphs.push(sents);
        paragraphMistakes.push([]); 
      }
    });

    currentSaveId = 'lesson_' + new Date().getTime();
    currentLessonTitle = rawTitle;
    currentLessonText = rawText;
    currentLessonVoices = [getCurrentVoiceName()];
    currentLessonDate = new Date().getTime();
    currentParaIndex = 0;
    lastPlayedDictRowId = null;
    lastPlayedMistakeRowId = null;
    absoluteLastPlayedRowId = null;

    // 儲存後自動清空「➕ 新增」輸入框並切回讀取分頁
    clearNewForm();
    switchTab('load');

    updateParagraphSelector();
    renderDictationList();
    renderMistakeList();
    autoSaveToCloud(); 
    checkAndDownloadAudio(); 
    closeTopCards(); 
  }

  function updateParagraphSelector() {
    var container = document.getElementById('paragraphSelectorContainer');
    var select = document.getElementById('paragraphSelect');
    if (paragraphs.length <= 1) {
      container.style.display = 'none';
    } else {
      container.style.display = 'block';
      select.innerHTML = '';
      for (var i = 0; i < paragraphs.length; i++) {
        var opt = document.createElement('option');
        opt.value = i;
        opt.textContent = '第 ' + (i + 1) + ' 段 (' + paragraphs[i].length + ' 句)';
        if (i === currentParaIndex) opt.selected = true;
        select.appendChild(opt);
      }
    }
  }

  function changeParagraph() {
    stopAudio();
    currentParaIndex = parseInt(document.getElementById('paragraphSelect').value);
    renderDictationList();
    renderMistakeList();
  }

  function handleVoiceChange() {
    renderDictationList(); 
    renderMistakeList();
    if (currentSaveId && currentLessonText) {
      var vName = getCurrentVoiceName();
      if (currentLessonVoices.indexOf(vName) === -1) {
        autoSaveToCloud();
      }
      checkAndDownloadAudio();
    }
  }

  function toggleDownloadPause(event) {
    if(event) event.stopPropagation();
    isDownloadPaused = !isDownloadPaused;
    var pauseBtn = document.getElementById('dlPauseBtn');
    var icon = document.getElementById('dlIcon');
    
    pauseBtn.innerHTML = isDownloadPaused ? '▶️' : '⏸️';
    
    if (isDownloadPaused) {
      document.getElementById('dlDetailText').textContent = "已暫停";
      icon.classList.remove('hourglass-spin'); 
    } else if (!isDownloading) {
      isDownloading = true;
      var vConfig = document.getElementById('googleVoiceSelect').value.split(',');
      fetchNextInQueue(vConfig[0], vConfig[1]);
    }
  }

  function updateDownloadUI(isComplete, isError, errMsg) {
    var bar = document.getElementById('downloadController');
    var detailSpan = document.getElementById('dlDetailText');
    var pauseBtn = document.getElementById('dlPauseBtn');
    var icon = document.getElementById('dlIcon');

    var remainSents = sentenceFetchQueue.length;
    var remainWords = wordFetchQueue.length;
    var totalRemain = remainSents + remainWords;

    if (isError) {
      bar.style.display = 'flex';
      bar.classList.remove('mode-cache');
      bar.classList.add('mode-api');
      detailSpan.textContent = "失敗: " + errMsg;
      icon.classList.remove('hourglass-spin');
      updateFloatingPositions();
      return;
    }

    if (isComplete || totalRemain === 0) {
      icon.classList.remove('hourglass-spin'); 
      bar.style.display = 'none'; 
      bar.classList.remove('mode-api', 'mode-cache');
      updateFloatingPositions();
    } else {
      bar.style.display = 'flex';
      
      var doneSents = totalFetchSents - remainSents;
      var doneWords = totalFetchWords - remainWords;
      var text = "";
      if (totalFetchSents > 0) text += "句子(" + doneSents + "/" + totalFetchSents + ") ";
      if (totalFetchWords > 0) text += "生字(" + doneWords + "/" + totalFetchWords + ")";
      detailSpan.textContent = text;
      pauseBtn.innerHTML = isDownloadPaused ? '▶️' : '⏸️';
      
      if (!isDownloadPaused) icon.classList.add('hourglass-spin');
      updateFloatingPositions();
    }
  }

  // ==========================================
  // 音檔來源檢查與自動下載隊列 (GitHub -> Drive -> API)
  // ==========================================
  function checkAndDownloadAudio() {
    var vConfig = document.getElementById('googleVoiceSelect').value.split(',');
    var voiceKey = vConfig[0];
    var langCode = vConfig[1];
    var saveTitle = currentLessonTitle || '未命名課文';

    if (!audioStateMap[voiceKey]) audioStateMap[voiceKey] = {};

    var allTexts = [];
    for (var p = 0; p < paragraphs.length; p++) {
      var sents = paragraphs[p] || [];
      sents.forEach(function(s) { if (allTexts.indexOf(s) === -1) allTexts.push(s); });
      var msts = paragraphMistakes[p] || [];
      msts.forEach(function(w) { if (allTexts.indexOf(w) === -1) allTexts.push(w); });
    }

    if (allTexts.length === 0) return;

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.items) {
          for (var t in res.items) {
            var existing = audioStateMap[voiceKey][t] || {};
            var info = res.items[t];
            if (info.source === 'github') {
              audioStateMap[voiceKey][t] = { source: 'github', url: info.url };
            } else if (info.source === 'drive') {
              audioStateMap[voiceKey][t] = { source: 'drive', fileId: info.fileId, base64: existing.base64 || null };
            } else {
              if (!existing.base64) {
                audioStateMap[voiceKey][t] = { source: 'api' };
              }
            }
            updateRowButtonUI(t);
          }
        }
        if (res && res.syncStatus && res.syncStatus.configured) {
          updateSyncStatusUI(res.syncStatus);
        }
        enqueuePendingAudio(voiceKey, langCode);
      })
      .withFailureHandler(function() {
        enqueuePendingAudio(voiceKey, langCode);
      })
      .getLessonAudioStatus(saveTitle, voiceKey, allTexts, getCfgRepo(), getCfgBranch());
  }

  function enqueuePendingAudio(voiceKey, langCode) {
    sentenceFetchQueue = [];
    wordFetchQueue = [];

    for (var p = 0; p < paragraphs.length; p++) {
      var currentSents = paragraphs[p] || [];
      for (var i = 0; i < currentSents.length; i++) {
        var s = currentSents[i];
        var st = audioStateMap[voiceKey][s];
        if (st && (st.source === 'github' || st.base64)) continue;
        if (sentenceFetchQueue.indexOf(s) === -1) sentenceFetchQueue.push(s);
      }
      var msts = paragraphMistakes[p] || [];
      for (var k = 0; k < msts.length; k++) {
        var w = msts[k];
        var stW = audioStateMap[voiceKey][w];
        if (stW && (stW.source === 'github' || stW.base64)) continue;
        if (wordFetchQueue.indexOf(w) === -1) wordFetchQueue.push(w);
      }
    }

    totalFetchSents = sentenceFetchQueue.length;
    totalFetchWords = wordFetchQueue.length;

    if (totalFetchSents === 0 && totalFetchWords === 0) {
      updateDownloadUI(true);
      return;
    }

    updateDownloadUI();
    if (!isDownloading && !isDownloadPaused) {
      isDownloading = true;
      fetchNextInQueue(voiceKey, langCode);
    }
  }

  function fetchNextInQueue(voiceName, langCode) {
    if (isDownloadPaused) {
      isDownloading = false;
      return;
    }

    if (sentenceFetchQueue.length === 0 && wordFetchQueue.length === 0) {
      isDownloading = false;
      updateDownloadUI(true);
      return;
    }
    
    updateDownloadUI();

    var isSentence = sentenceFetchQueue.length > 0;
    var textToFetch = isSentence ? sentenceFetchQueue[0] : wordFetchQueue[0];
    var saveTitle = currentLessonTitle || '未命名課文';
    var state = (audioStateMap[voiceName] && audioStateMap[voiceName][textToFetch]) || { source: 'api' };

    var dlBar = document.getElementById('downloadController');
    if (state.source === 'drive') {
      dlBar.classList.remove('mode-api');
      dlBar.classList.add('mode-cache');
    } else {
      dlBar.classList.remove('mode-cache');
      dlBar.classList.add('mode-api');
    }

    var successFn = function(res) {
      if (res && res.success) {
        if (res.cached) {
          dlBar.classList.remove('mode-api');
          dlBar.classList.add('mode-cache');
        } else {
          dlBar.classList.remove('mode-cache');
          dlBar.classList.add('mode-api');
          incrementUnsyncedCounter();
        }

        audioStateMap[voiceName][textToFetch] = {
          source: 'drive',
          fileId: res.fileId || state.fileId || '',
          base64: res.audioContent
        };
        updateRowButtonUI(textToFetch);
        if (isSentence) sentenceFetchQueue.shift(); else wordFetchQueue.shift();
      } else {
        isDownloading = false;
        updateDownloadUI(false, true, res ? res.error : "未知錯誤");
        sentenceFetchQueue = []; wordFetchQueue = [];
        return;
      }
      fetchNextInQueue(voiceName, langCode); 
    };
    
    var failureFn = function() {
      if (isSentence) sentenceFetchQueue.shift(); else wordFetchQueue.shift();
      fetchNextInQueue(voiceName, langCode); 
    };

    if (state.source === 'drive' && state.fileId) {
      google.script.run
        .withSuccessHandler(successFn)
        .withFailureHandler(failureFn)
        .getDriveAudioById(state.fileId);
    } else if (voiceName.indexOf('Neural') !== -1) {
      google.script.run
        .withSuccessHandler(successFn)
        .withFailureHandler(failureFn)
        .getAzureTTS(textToFetch, voiceName, langCode, 1.0, saveTitle); 
    } else {
      google.script.run
        .withSuccessHandler(successFn)
        .withFailureHandler(failureFn)
        .getGoogleTTS(textToFetch, voiceName, langCode, 1.0, saveTitle); 
    }
  }

  function autoDownloadWord(word) {
    var vConfig = document.getElementById('googleVoiceSelect').value.split(',');
    var voiceKey = vConfig[0];
    if (!audioStateMap[voiceKey]) audioStateMap[voiceKey] = {};
    var st = audioStateMap[voiceKey][word];
    if (st && (st.source === 'github' || st.base64)) return;

    if (!st) {
      audioStateMap[voiceKey][word] = { source: 'api' };
    }

    if (wordFetchQueue.indexOf(word) === -1) {
      wordFetchQueue.push(word);
      totalFetchWords++;
      updateDownloadUI();
    }

    if (!isDownloading && !isDownloadPaused) {
      isDownloading = true;
      fetchNextInQueue(vConfig[0], vConfig[1]);
    }
  }

  function getPlayButtonConfig(text) {
    var voiceKey = getCurrentVoiceName();
    var st = audioStateMap[voiceKey] && audioStateMap[voiceKey][text];
    if (st && (st.source === 'github' || st.source === 'drive')) {
      return {
        className: 'btn-play-line',
        html: '▶️ 播放'
      };
    }
    return {
      className: 'btn-play-line btn-fallback',
      html: '⏳ 播放'
    };
  }

  function updateRowButtonUI(text) {
    var cfg = getPlayButtonConfig(text);
    var btns = document.querySelectorAll('button[data-text]');
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].getAttribute('data-text') === text) {
        btns[i].className = cfg.className;
        btns[i].innerHTML = cfg.html;
      }
    }
  }

  function getPlayableAudioSrc(voiceKey, text) {
    var st = audioStateMap[voiceKey] && audioStateMap[voiceKey][text];
    if (!st) return null;
    if (st.source === 'github' && st.url) {
      return st.url;
    }
    if (st.base64) {
      return "data:audio/mp3;base64," + st.base64;
    }
    return null;
  }

  function handleManualReveal(el) {
    if (el.classList.contains('manual-reveal')) {
      el.classList.remove('manual-reveal');
      if (el.revealTimer) clearTimeout(el.revealTimer);
    } else {
      el.classList.add('manual-reveal');
      if (el.revealTimer) clearTimeout(el.revealTimer);
      el.revealTimer = setTimeout(function() {
        el.classList.remove('manual-reveal');
      }, 5000);
    }
  }

  function renderDictationList() {
    var container = document.getElementById('dictationList');
    container.innerHTML = '';
    
    var isHidden = document.getElementById('hideTextToggle').checked;
    if (isHidden) container.classList.add('text-hidden');
    else container.classList.remove('text-hidden');

    var currentSents = paragraphs[currentParaIndex] || [];
    var currentMistakes = paragraphMistakes[currentParaIndex] || [];

    if (currentSents.length === 0) {
      container.innerHTML = '<div style="text-align:center; color:#94a3b8; padding: 10px;">尚無內容</div>';
      return;
    }

    for (var i = 0; i < currentSents.length; i++) {
      var row = document.createElement('div');
      row.className = 'sentence-row';
      row.id = 'dict-row-' + i; 

      var idxSpan = document.createElement('span');
      idxSpan.className = 'row-index';
      idxSpan.innerHTML = (i + 1) + '.';
      idxSpan.id = 'indicator-dict-row-' + i;
      idxSpan.setAttribute('data-index', (i + 1) + '.');
      row.appendChild(idxSpan);

      var btn = document.createElement('button');
      var btnCfg = getPlayButtonConfig(currentSents[i]);
      btn.className = btnCfg.className;
      btn.innerHTML = btnCfg.html;
      btn.setAttribute('data-text', currentSents[i]); 
      btn.onclick = (function(idx, rowEl) { 
        return function(e) { e.stopPropagation(); playSingleText(currentSents[idx], rowEl, false); }; 
      })(i, row);
      row.appendChild(btn);

      var txtContainer = document.createElement('span');
      txtContainer.className = 'sentence-text';
      txtContainer.onclick = function(e) {
        if (document.getElementById('hideTextToggle').checked && e.target.tagName !== 'BUTTON') {
           handleManualReveal(this);
        }
      };
      
      var words = currentSents[i].split(/(\s+)/);
      words.forEach(function(w) {
        if (w.trim().length === 0) {
          txtContainer.appendChild(document.createTextNode(w));
        } else {
          var match = w.match(/^([^a-zA-Z0-9]*)([a-zA-Z0-9'-]+)([^a-zA-Z0-9]*)$/);
          if (match) {
            if (match[1]) txtContainer.appendChild(document.createTextNode(match[1]));
            var wordSpan = document.createElement('span');
            var cleanWord = match[2];
            wordSpan.textContent = cleanWord;
            
            if (currentMistakes.indexOf(cleanWord) !== -1) wordSpan.className = 'clickable-word word-mistake';
            else wordSpan.className = 'clickable-word';
            
            wordSpan.onclick = function(e) { 
               if (document.getElementById('hideTextToggle').checked && !txtContainer.classList.contains('manual-reveal')) return;
               e.stopPropagation();
               var isMarked = this.classList.toggle('word-mistake'); 
               if (isMarked) {
                 if (currentMistakes.indexOf(cleanWord) === -1) {
                   currentMistakes.push(cleanWord);
                   autoDownloadWord(cleanWord); 
                 }
               } else {
                 var idx = currentMistakes.indexOf(cleanWord);
                 if (idx !== -1) currentMistakes.splice(idx, 1);
               }
               autoSaveToCloud();
               renderMistakeList();
            };
            txtContainer.appendChild(wordSpan);
            if (match[3]) txtContainer.appendChild(document.createTextNode(match[3]));
          } else {
            var span = document.createElement('span');
            var cleanWord = w;
            span.textContent = cleanWord;
            if (currentMistakes.indexOf(cleanWord) !== -1) span.className = 'clickable-word word-mistake';
            else span.className = 'clickable-word';

            span.onclick = function(e) { 
               if (document.getElementById('hideTextToggle').checked && !txtContainer.classList.contains('manual-reveal')) return;
               e.stopPropagation();
               var isMarked = this.classList.toggle('word-mistake'); 
               if (isMarked) {
                 if (currentMistakes.indexOf(cleanWord) === -1) {
                   currentMistakes.push(cleanWord);
                   autoDownloadWord(cleanWord); 
                 }
               } else {
                 var idx = currentMistakes.indexOf(cleanWord);
                 if (idx !== -1) currentMistakes.splice(idx, 1);
               }
               autoSaveToCloud();
               renderMistakeList();
            };
            txtContainer.appendChild(span);
          }
        }
      });
      row.appendChild(txtContainer);
      container.appendChild(row);

      if (lastPlayedDictRowId === row.id) idxSpan.textContent = '📍';
      if (absoluteLastPlayedRowId === row.id) row.classList.add('last-played-highlight');
      if (currentlyPlayingRowId === row.id) row.classList.add('playing-highlight');
    }
  }

  function renderMistakeList() {

    container.innerHTML = '';
    
    var isHidden = document.getElementById('hideMistakeToggle').checked;
    if (isHidden) container.classList.add('text-hidden');
    else container.classList.remove('text-hidden');

        var mArr = paragraphMistakes[p] || [];
        for(var k=0; k<mArr.length; k++) {
           if(allM.indexOf(mArr[k]) === -1) allM.push(mArr[k]);

  function setLastPlayedIndicator(rowId, isMistakeMode) {
    if (!isMistakeMode) {
      if (lastPlayedDictRowId && lastPlayedDictRowId !== rowId) {
        var oldIdxSpan = document.getElementById('indicator-' + lastPlayedDictRowId);
        if (oldIdxSpan) oldIdxSpan.innerHTML = oldIdxSpan.getAttribute('data-index');
      }
      lastPlayedDictRowId = rowId;
    } else {
      if (lastPlayedMistakeRowId && lastPlayedMistakeRowId !== rowId) {
        var oldIdxSpanM = document.getElementById('indicator-' + lastPlayedMistakeRowId);
        if (oldIdxSpanM) oldIdxSpanM.innerHTML = oldIdxSpanM.getAttribute('data-index');
      }
      lastPlayedMistakeRowId = rowId;
    }
    
    var idxSpan = document.getElementById('indicator-' + rowId);
    if (idxSpan) idxSpan.textContent = '📍';

    var rows = document.querySelectorAll('.sentence-row');
    for (var i = 0; i < rows.length; i++) {
      rows[i].classList.remove('last-played-highlight');
    }
    var newRow = document.getElementById(rowId);
    if (newRow) newRow.classList.add('last-played-highlight');
    
    absoluteLastPlayedRowId = rowId;
  }

  function clearPlayingHighlight() {
    var rows = document.querySelectorAll('.sentence-row');
    for (var i = 0; i < rows.length; i++) {
      rows[i].classList.remove('playing-highlight');
    }
  }

  function stopAudio() {
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    if(sharedAudio) {
      sharedAudio.onended = null;
      sharedAudio.onerror = null;
      sharedAudio.pause();
    }
    currentAudio = null;
    isContinuousPlaying = false;
    currentlyPlayingRowId = null;
    if(continuousTimer) clearTimeout(continuousTimer);
    clearPlayingHighlight(); 
  }

  function playSingleText(textToPlay, rowElement, isMistakeMode) {
    stopAudio(); 
    var speed = globalSpeedValue; 
    var voiceKey = getCurrentVoiceName();
    
    if (rowElement) {
      currentlyPlayingRowId = rowElement.id;
      rowElement.classList.add('playing-highlight');
      setLastPlayedIndicator(rowElement.id, isMistakeMode);
    }
    
    var onEnd = function() { clearPlayingHighlight(); currentlyPlayingRowId = null; currentAudio = null; };
    var audioSrc = getPlayableAudioSrc(voiceKey, textToPlay);

    if (audioSrc) {
      currentAudio = sharedAudio;
      sharedAudio.src = audioSrc;
      sharedAudio.playbackRate = speed; 
      sharedAudio.defaultPlaybackRate = speed;
      sharedAudio.onended = onEnd;
      sharedAudio.onerror = onEnd;
      var playPromise = sharedAudio.play();
      if (playPromise !== undefined) playPromise.catch(function() { onEnd(); });
      return;
    }

    var st = audioStateMap[voiceKey] && audioStateMap[voiceKey][textToPlay];
    if (st && st.source === 'drive' && st.fileId) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success && res.audioContent) {
            st.base64 = res.audioContent;
            currentAudio = sharedAudio;
            sharedAudio.src = "data:audio/mp3;base64," + res.audioContent;
            sharedAudio.playbackRate = speed;
            sharedAudio.defaultPlaybackRate = speed;
            sharedAudio.onended = onEnd;
            sharedAudio.onerror = onEnd;
            var p = sharedAudio.play();
            if (p !== undefined) p.catch(function() { onEnd(); });
          } else {
            onEnd();
          }
        })
        .withFailureHandler(onEnd)
        .getDriveAudioById(st.fileId);
      return;
    }

    var utter = new SpeechSynthesisUtterance(textToPlay);
    utter.lang = 'en-US'; 
    var enV = nativeVoices.filter(function(v) { return v.lang.indexOf('en') === 0; });
    if(enV.length > 0) utter.voice = enV[0];
    utter.rate = speed;
    utter.onend = onEnd;
    utter.onerror = onEnd;
    window.speechSynthesis.speak(utter);
    
    autoDownloadWord(textToPlay);
  }

  function startContinuousPlay(isMistakeMode) {
    stopAudio();
    isMistakeContinuous = isMistakeMode; 
    
    if (isMistakeMode) {
      if (currentRenderedMistakes.length === 0) return showToast('無生字', true);
      continuousPlayList = currentRenderedMistakes;
    } else {
      var currentSents = paragraphs[currentParaIndex] || [];
      if (currentSents.length === 0) return showToast('請先讀取或新增課文', true);
      continuousPlayList = currentSents;
    }
    
    if (window.speechSynthesis) {
      window.speechSynthesis.cancel();
    }

    isContinuousPlaying = true;
    continuousIndex = 0;
    playNextContinuousItem();
  }

  function playNextContinuousItem() {
    if (!isContinuousPlaying || continuousIndex >= continuousPlayList.length) {
      isContinuousPlaying = false;
      clearPlayingHighlight();
      currentlyPlayingRowId = null;
      currentAudio = null;
      return;
    }

    clearPlayingHighlight(); 
    var prefix = isMistakeContinuous ? 'mistake-row-' : 'dict-row-';
    var rowEl = document.getElementById(prefix + continuousIndex);
    
    if (rowEl) {
      currentlyPlayingRowId = rowEl.id;
      rowEl.classList.add('playing-highlight');
      setLastPlayedIndicator(rowEl.id, isMistakeContinuous);
    }

    var speed = globalSpeedValue;
    var pauseMs = parseFloat(document.getElementById('pauseContinuous').value) * 1000;
    var textToPlay = continuousPlayList[continuousIndex];
    var voiceKey = getCurrentVoiceName();

    var onEndFn = function() {
      if(!isContinuousPlaying) return;
      continuousTimer = setTimeout(function() {
        continuousIndex++;
        playNextContinuousItem();
      }, pauseMs);
    };

    var onErrorFn = function() {
      isContinuousPlaying = false;
      clearPlayingHighlight();
      currentlyPlayingRowId = null;
      currentAudio = null;
    };

    var audioSrc = getPlayableAudioSrc(voiceKey, textToPlay);

    if (!audioSrc) {
      var utter = new SpeechSynthesisUtterance(textToPlay);
      utter.lang = 'en-US'; 
      var enV = nativeVoices.filter(function(v) { return v.lang.indexOf('en') === 0; });
      if(enV.length > 0) utter.voice = enV[0];
      utter.rate = speed;
      utter.onend = onEndFn;
      utter.onerror = onErrorFn;
      window.speechSynthesis.speak(utter);
      autoDownloadWord(textToPlay);
    } else {
      currentAudio = sharedAudio;
      sharedAudio.onended = onEndFn;
      sharedAudio.onerror = onErrorFn;
      sharedAudio.src = audioSrc;
      sharedAudio.playbackRate = speed;
      sharedAudio.defaultPlaybackRate = speed;
      
      var playPromise = sharedAudio.play();
      if (playPromise !== undefined) {
        playPromise.catch(function(err) {
          console.error("iOS Audio Play Error:", err);
          onErrorFn();
        });
      }
    }
  }

  function toggleTextVisibility(containerId, toggleId) {
    var container = document.getElementById(containerId);
    var isHidden = document.getElementById(toggleId).checked;
    if (isHidden) container.classList.add('text-hidden');
    else container.classList.remove('text-hidden');
    
    if (!isHidden) {
      var reveals = container.querySelectorAll('.manual-reveal');
      for(var i=0; i<reveals.length; i++) reveals[i].classList.remove('manual-reveal');
    }
  }

  function loadAppUrlAndQr() {
    if (window.location.hostname.indexOf('github.io') !== -1) {
      renderQrCode(window.location.href);
      return;
    }
    google.script.run
      .withSuccessHandler(function(url) {
        if (url) renderQrCode(url);
      })
      .getAppUrl();
  }

  function renderQrCode(url) {
    var qrImg = document.getElementById('qrImg');
    qrImg.src = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + encodeURIComponent(url);
    qrImg.onload = function() {
      qrImg.style.display = 'inline-block';
      document.getElementById('urlText').style.display = 'none';
    };
    qrImg.onerror = function() {
      qrImg.style.display = 'none';
      var txt = document.getElementById('urlText');
      txt.textContent = url;
      txt.style.display = 'block';
    };
  }

  function initNativeVoices() {
    function populate() { nativeVoices = window.speechSynthesis.getVoices(); }
    if(window.speechSynthesis) { window.speechSynthesis.onvoiceschanged = populate; populate(); }
  }
</script>
</body>
</html>
